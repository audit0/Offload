name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Сборка
        run: swift build -c release

      - name: Проверки
        env:
          OFFLOAD_SKIP_DOCKER: "1"
        run: swift run -c release OffloadChecks

      # Universal и упаковка — ровно то, что делает release.yml на теге.
      # Иначе первая же проверка этих шагов случалась бы на настоящем релизе.
      - name: Сборка Offload.app (universal)
        env:
          OFFLOAD_UNIVERSAL: "1"
        run: scripts/build-app.sh 0.0.0-ci

      - name: Упаковка zip и dmg
        run: scripts/make-release.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Offload-ci
          path: |
            dist/Offload.zip
            dist/Offload.dmg
          retention-days: 7
