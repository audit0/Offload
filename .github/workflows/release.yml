name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  # Подтверждение сборки (attestation): подпись Sigstore, что архивы собраны этим workflow из этого репозитория.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Имя тега передаётся через env, а не подставляется в скрипт: так его нельзя использовать для внедрения команд.
      - name: Проверка тега
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Некорректный тег: $TAG"; exit 1; }
          [[ "${TAG#v}" == "$(cat VERSION)" ]] || { echo "Тег $TAG не совпадает с VERSION $(cat VERSION)"; exit 1; }

      - name: Проверки
        env:
          OFFLOAD_SKIP_DOCKER: "1"
        run: swift run -c release OffloadChecks

      - name: Сборка universal
        env:
          OFFLOAD_UNIVERSAL: "1"
        run: scripts/build-app.sh

      - name: Упаковка
        run: scripts/make-release.sh

      - name: Подтверждение сборки
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Offload.zip
            dist/Offload.dmg

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            dist/Offload.zip dist/Offload.zip.sha256 \
            dist/Offload.dmg dist/Offload.dmg.sha256 \
            --title "Offload $TAG" --generate-notes --verify-tag

  windows:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Проверки
        env:
          OFFLOAD_SKIP_DOCKER: "1"
          OFFLOAD_SKIP_VAULT: "1"
        run: dotnet run -c Release --project src/Offload.Checks

      - name: Сборка и упаковка (x64 и ARM64)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.Substring(1)
          foreach ($runtime in 'win-x64', 'win-arm64') {
            ./scripts/build.ps1 -Runtime $runtime -Version $version
            ./scripts/make-release.ps1 -Runtime $runtime
          }

      - name: Подтверждение сборки
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            windows/dist/OffLoadAI-Windows-x64.zip
            windows/dist/OffLoadAI-Windows-arm64.zip

      - name: Добавить в релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload $env:TAG dist/OffLoadAI-Windows-x64.zip dist/OffLoadAI-Windows-x64.zip.sha256 `
            dist/OffLoadAI-Windows-arm64.zip dist/OffLoadAI-Windows-arm64.zip.sha256 --repo ${{ github.repository }}
